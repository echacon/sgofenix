tipos_operacion:
  - nombre: "DIS"
    descripcion: "Dispersión - Mezcla inicial de alta velocidad para formar pasta"
  
  - nombre: "MOL"
    descripcion: "Molienda - Reducción del tamaño de partícula de pigmentos"
  
