{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>📚 Carga de Taxonomía PPR</h1>
    
    <div class="card">
        <div class="card-header">
            📥 Descargar plantilla
        </div>
        <div class="card-body">
            <a href="{{ url_for('static', filename='plantillas/02_taxonomia.xlsx') }}" 
               class="btn btn-success">
               ⬇️ Descargar Plantilla Taxonomía
            </a>
        </div>
    </div>
    
    <div class="card mt-3">
        <div class="card-header">
            📤 Subir archivo
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="archivo" class="form-label">Archivo Excel (02_taxonomia.xlsx)</label>
                    <input type="file" class="form-control" id="archivo" name="archivo" accept=".xlsx,.xls" required>
                </div>
                <button type="submit" class="btn btn-primary">Validar e Importar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
